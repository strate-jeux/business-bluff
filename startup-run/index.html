<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARTUP RUN</title>
<style>
/* =========================================================
   STARTUP RUN — by STRATÉJEUX
   All colours are CSS variables. Edit them here.
   ========================================================= */
:root {
  --blue: #2556F5;          /* STRATÉJEUX royal blue */
  --blue-light: #3D6BFF;
  --blue-dark: #173CC0;
  --blue-deep: #0F2A8F;
  --navy: #0B1E5B;
  --accent: #FFD43B;        /* TODO: replace with the exact STRATÉJEUX yellow */
  --coral: #FF6B5B;
  --alert: #FF4D5E;
  --white: #FFFFFF;
  --sky: #8DB8FF;
  --green: #2EC27E;
  --green-dark: #178A55;
  --skin: #F5C29B;
  --brown: #9A6235;
  --grey: #A9B4C8;
  --orange: #FF8A2B;
  --pink: #FF9EC2;
  --purple: #8E5BE8;
  --teal: #12A4C4;
  --red: #E8453C;
  --gold: #F2B705;
  --charcoal: #3A3F58;
  --magenta: #E0529C;
  --soft: #F2F5FF;
  --line: #D5DEF5;
  --muted: #6B7AA6;

  /* card types */
  --theme: #5B9BFF;      --theme-tint: #E2EDFF;
  --target: #FFD43B;     --target-tint: #FFF5CC;
  --constraint: #FF6B5B; --constraint-tint: #FFE4E0;

  /* avatar backgrounds */
  --av-bg1: #D6E6FF; --av-bg2: #FFF0B3; --av-bg3: #CDEFD9; --av-bg4: #FFD6E4;
  --av-bg5: #FFE3C7; --av-bg6: #CFF3F8; --av-bg7: #FFE680; --av-bg8: #D9F7E6;

  --panel: rgba(255, 255, 255, .10);
  --panel-line: rgba(255, 255, 255, .22);
  --panel-dark: rgba(11, 30, 91, .45);
  --shadow: 0 .5rem 1.5rem rgba(6, 18, 70, .35);
  --font: "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
}

/* 1rem = 24px at 1920x1080, ~17px at 1366x768: the whole app scales like a slide */
html { font-size: clamp(12px, min(1.25vw, 2.222vh), 40px); }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; overflow: hidden;
  font-family: var(--font); color: var(--white);
  background: radial-gradient(circle at 15% 0%, var(--blue-light) 0%, var(--blue) 45%, var(--blue-dark) 100%);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; }
svg text { font-family: var(--font); }
h1, h2, h3, p { margin: 0; }

/* ---------- SVG palette classes (used by every illustration) ---------- */
.fb { fill: var(--blue); }   .fy { fill: var(--accent); } .fc { fill: var(--coral); }
.fn { fill: var(--navy); }   .fw { fill: var(--white); }  .fg { fill: var(--green); }
.fd { fill: var(--green-dark); } .fs { fill: var(--skin); } .fk { fill: var(--brown); }
.fl { fill: var(--sky); }    .fp { fill: var(--pink); }   .fo { fill: var(--orange); }
.fe { fill: var(--grey); }   .fv { fill: var(--purple); } .fr { fill: var(--red); }
.ft { fill: var(--teal); }   .fm { fill: var(--magenta); } .fh { fill: var(--charcoal); }
.fq { fill: var(--gold); }
.ln { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.kb { stroke: var(--blue); } .ky { stroke: var(--accent); } .kc { stroke: var(--coral); }
.kn { stroke: var(--navy); } .kw { stroke: var(--white); }  .kg { stroke: var(--green); }
.kk { stroke: var(--brown); } .ke { stroke: var(--grey); }  .ko { stroke: var(--orange); }
.kp { stroke: var(--pink); }

/* ---------- App frame ---------- */
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
main { position: relative; min-height: 0; overflow: hidden; }
.screen { height: 100%; padding: .9rem 1.2rem 1rem; min-height: 0; }

.topbar {
  height: 3.6rem; display: flex; align-items: center; gap: 1rem; padding: 0 1rem;
  background: rgba(11, 30, 91, .35); border-bottom: 1px solid var(--panel-line);
}
.brand { display: flex; align-items: center; gap: .5rem; font-weight: 900; font-size: 1.1rem; letter-spacing: .04em; white-space: nowrap; }
.brand svg { width: 1.6rem; height: 2.2rem; }
.brand span { color: var(--accent); }
body[data-step="setup"] .brand { visibility: hidden; }
.steps { flex: 1; display: flex; justify-content: center; align-items: center; gap: .3rem; }
.step {
  display: flex; align-items: center; gap: .45rem; border: 0; cursor: pointer;
  padding: .3rem .9rem .3rem .35rem; border-radius: 999px; font-weight: 900; font-size: .85rem; letter-spacing: .05em;
  background: rgba(255, 255, 255, .12); color: var(--white);
}
.step .num { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.2); }
.step.done { background: rgba(255, 255, 255, .24); }
.step.current { background: var(--accent); color: var(--navy); box-shadow: 0 0 0 .2rem rgba(255, 212, 59, .3); }
.step.current .num { background: var(--navy); color: var(--accent); }
.step.locked { opacity: .38; cursor: not-allowed; }
.step-arrow { width: 1rem; height: 1rem; opacity: .6; }
.step-arrow svg { width: 100%; height: 100%; display: block; }
.tools { display: flex; gap: .4rem; }
.iconbtn {
  width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: rgba(255, 255, 255, .16); color: var(--white); font-weight: 900; font-size: 1.1rem;
}
.iconbtn:hover { background: rgba(255, 255, 255, .28); }
.iconbtn svg { width: 1.3rem; height: 1.3rem; }
.iconbtn.off { background: var(--alert); }

/* ---------- Buttons ---------- */
.btn {
  border: 0; cursor: pointer; font-weight: 900; font-size: 1rem; letter-spacing: .02em;
  padding: .6rem 1.2rem; border-radius: .8rem; background: var(--white); color: var(--navy);
  box-shadow: 0 .25rem 0 rgba(6, 18, 70, .3); transition: transform .08s, filter .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(.15rem); box-shadow: 0 .1rem 0 rgba(6, 18, 70, .3); }
.btn svg { width: 1.2em; height: 1.2em; }
.btn.accent { background: var(--accent); color: var(--navy); }
.btn.blue { background: var(--blue); color: var(--white); }
.btn.ghost { background: rgba(255, 255, 255, .16); color: var(--white); box-shadow: none; }
.btn.coral { background: var(--coral); color: var(--white); }
.btn.big { font-size: 1.25rem; padding: .75rem 1.5rem; }
.btn.mega { font-size: 1.7rem; padding: .9rem 2.2rem; border-radius: 1.1rem; box-shadow: 0 .35rem 0 rgba(6, 18, 70, .35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.btn.pulse { animation: btnPulse 1.4s ease-in-out infinite; }
@keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.avatar { display: inline-block; flex: none; border-radius: 50%; }
.avatar svg { width: 100%; height: 100%; display: block; }
.scene svg { width: 100%; height: 100%; display: block; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; align-items: center; padding: .8rem 2.2rem; }
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; }
.hero .scene { width: 24rem; height: 18rem; }
.title { font-size: 5.4rem; font-weight: 900; letter-spacing: .02em; line-height: .95; text-shadow: 0 .4rem 0 var(--navy); }
.title span { color: var(--accent); }
.subtitle { font-size: 1.7rem; font-weight: 800; margin-top: .6rem; }
.credit { font-size: .85rem; margin-top: .8rem; opacity: .8; letter-spacing: .2em; font-weight: 700; }
.setup-panel { background: var(--white); color: var(--navy); border-radius: 1.4rem; padding: 1.1rem 1.6rem; box-shadow: var(--shadow); }
.setup-panel h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: .6rem; }
.field { margin-bottom: .8rem; }
.field-label { display: block; font-weight: 900; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); margin-bottom: .35rem; }
.seg { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.seg button {
  min-width: 3rem; padding: .4rem .8rem; border-radius: .7rem; border: 2px solid var(--line);
  background: var(--soft); color: var(--navy); font-weight: 800; font-size: 1rem; cursor: pointer;
}
.seg button.on { background: var(--blue); color: var(--white); border-color: var(--blue); }
.seg .custom { display: flex; align-items: center; gap: .3rem; font-weight: 700; margin-left: .4rem; }
.seg .custom input { width: 4.2rem; }
.seg .custom.on input { border-color: var(--blue); background: var(--soft); }
.text-input {
  font-size: 1rem; padding: .35rem .6rem; border-radius: .6rem; border: 2px solid var(--line);
  color: var(--navy); font-weight: 700; background: var(--white); min-width: 0;
}
.text-input:focus { outline: none; border-color: var(--blue); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem .8rem; }
.name-row { display: flex; align-items: center; gap: .5rem; }
.name-row .avatar { width: 2.3rem; height: 2.3rem; }
.name-row input { flex: 1; }
.setup-panel .btn.mega { width: 100%; margin-top: .3rem; }

/* ---------- Resume ---------- */
.resume { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
.resume .mascot-big { width: 9rem; height: 12rem; animation: bob 1.8s ease-in-out infinite; }
.resume h1 { font-size: 3.6rem; font-weight: 900; text-shadow: 0 .3rem 0 var(--navy); }
.resume p { font-size: 1.2rem; opacity: .9; }
.resume .row { display: flex; gap: 1rem; margin-top: .5rem; }

/* ---------- Screen heads ---------- */
.screen-head { display: flex; align-items: center; gap: 1rem; margin-bottom: .6rem; }
.screen-head .scene { width: 7.5rem; height: 5rem; flex: none; }
.screen-head h2 { font-size: 1.7rem; font-weight: 900; }
.screen-head p { font-size: 1rem; opacity: .9; }
.screen-head .grow { flex: 1; min-width: 0; }
.head-actions { display: flex; gap: .6rem; align-items: center; }

/* ---------- Cards ---------- */
.t-theme { --tc: var(--theme); --tt: var(--theme-tint); }
.t-target { --tc: var(--target); --tt: var(--target-tint); }
.t-constraint { --tc: var(--constraint); --tt: var(--constraint-tint); }
.cards-row {
  flex: 1; min-height: 0; display: flex; gap: 3%; justify-content: center; align-items: center;
  container-type: size;
}
.card {
  position: relative; flex: none; cursor: pointer; perspective: 1200px;
  width: min(31cqw, 75cqh); height: min(100cqh, 46.5cqw);
  container-type: inline-size;
}
.card-inner {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.3, 1.35, .5, 1);
}
.card.revealed .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; border-radius: 8cqw; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 3cqw solid var(--tc); box-shadow: 0 .3rem .8rem rgba(6, 18, 70, .35);
}
.card-back {
  background: linear-gradient(160deg, var(--navy), var(--blue-deep));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw;
}
.card:not(.revealed):hover .card-back { filter: brightness(1.2); }
.back-art { width: 72%; max-height: 72%; }
.back-art svg { width: 100%; height: 100%; display: block; }
.back-label { color: var(--tc); font-weight: 900; letter-spacing: .1em; font-size: clamp(8px, 10cqw, 2rem); }
.slot {
  display: none; position: absolute; left: 6%; right: 6%; top: 28%; bottom: 28%;
  background: var(--white); color: var(--navy); border-radius: 5cqw; box-shadow: inset 0 0 0 2cqw var(--tc);
  align-items: center; justify-content: center; text-align: center; padding: 3cqw;
  font-weight: 900; line-height: 1.1; font-size: clamp(9px, 11cqw, 2.6rem);
}
.card.rolling .slot { display: flex; }
.card.rolling .back-art { opacity: .25; }
.card.rolling .card-inner { animation: shake .12s linear infinite; }
@keyframes shake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5%); } }
.card-front { transform: rotateY(180deg); background: var(--white); display: flex; flex-direction: column; }
.card-front .art { flex: 0 0 50%; background: var(--tt); display: flex; align-items: center; justify-content: center; padding: 3cqw; }
.card-front .art svg { width: 100%; height: 100%; display: block; }
.card-front .txt {
  flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 2cqw 5cqw 4cqw; color: var(--navy);
}
.ctype {
  font-size: clamp(7px, 7.5cqw, 1.2rem); font-weight: 900; letter-spacing: .1em;
  background: var(--tc); color: var(--navy); border-radius: 999px; padding: .6cqw 4cqw; margin-bottom: 3cqw;
}
.cname { font-size: clamp(9px, 12cqw, 3rem); font-weight: 900; line-height: 1.08; }
.reroll {
  position: absolute; z-index: 5; top: -.55rem; right: -.55rem; transform: translateZ(2px);
  width: 2.1rem; height: 2.1rem; border-radius: 50%; border: .18rem solid var(--navy);
  background: var(--accent); color: var(--navy); cursor: pointer; display: grid; place-items: center; padding: 0;
  box-shadow: 0 .2rem .4rem rgba(0, 0, 0, .3);
}
.reroll svg { width: 1.2rem; height: 1.2rem; }
.reroll:hover { transform: translateZ(2px) rotate(-30deg); }

/* ---------- Draw ---------- */
.draw { display: flex; flex-direction: column; }
.team-grid {
  flex: 1; min-height: 0; display: grid; gap: .7rem;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
}
.team-panel {
  min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: .45rem .6rem .35rem;
  background: var(--panel); border: .15rem solid var(--panel-line); border-radius: 1rem; transition: border-color .3s, box-shadow .3s;
}
.team-panel.ready { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(255, 212, 59, .3); }
.tp-head { display: flex; align-items: center; gap: .5rem; cursor: pointer; min-width: 0; }
.tp-head .avatar { width: 2.3rem; height: 2.3rem; }
.tp-name { flex: 1; min-width: 0; font-weight: 900; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-ready {
  background: var(--accent); color: var(--navy); font-weight: 900; font-size: .75rem; letter-spacing: .08em;
  padding: .15rem .55rem; border-radius: 999px; animation: popIn .5s cubic-bezier(.3, 1.6, .5, 1);
}
.zoom-btn { width: 2rem; height: 2rem; }
.zoom-btn svg { width: 1.1rem; height: 1.1rem; }
.team-panel .cards-row { margin: .45rem 0 .35rem; }
/* 5 to 8 teams: narrower panels, so cards may be taller than 2:3 to keep the text readable */
.team-grid.dense .cards-row { gap: 2.5%; }
.team-grid.dense .card { width: 31.5cqw; height: min(100cqh, 60cqw); }
.team-grid.dense .card-front .art { flex-basis: 44%; }
.team-grid.dense .cname { font-size: clamp(10px, 13.5cqw, 3rem); }
.cname.long, .team-grid.dense .cname.long { font-size: clamp(8px, 10cqw, 2.4rem); }
.tp-foot { font-size: .75rem; text-align: center; font-weight: 700; opacity: .85; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

/* ---------- Timers ---------- */
.timer { text-align: center; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .digits { font-size: var(--tsize, 9rem); text-shadow: 0 .35rem 0 rgba(6, 18, 70, .35); transition: color .3s; white-space: nowrap; }
.timer.warn .digits { color: var(--accent); }
.timer.danger .digits { color: var(--alert); animation: pulse 1s ease-in-out infinite; }
.timer.done .digits { color: var(--accent); font-size: calc(var(--tsize, 9rem) * .5); animation: flash .5s ease-in-out 6; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes flash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.06); } }
.timer-controls { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: .8rem; }
.timer-controls .btn.main { min-width: 9rem; }
.timer-label { font-size: 1.05rem; font-weight: 900; letter-spacing: .14em; color: var(--accent); margin-bottom: .3rem; }

/* ---------- Build ---------- */
.build { display: grid; grid-template-rows: minmax(0, 1fr) var(--recap-h); gap: .7rem; }
.build-top { display: grid; grid-template-columns: 1.3fr 1fr; gap: .8rem; min-height: 0; }
.timer-panel {
  display: grid; grid-template-columns: 11rem 1fr; align-items: center; gap: .5rem;
  background: var(--panel-dark); border-radius: 1.2rem; padding: 1rem; min-height: 0;
}
.timer-panel .scene { width: 11rem; height: 11rem; }
.side {
  background: var(--white); color: var(--navy); border-radius: 1.2rem; padding: .8rem 1rem;
  display: flex; flex-direction: column; gap: .45rem; min-height: 0; overflow: hidden;
}
.side h3 { font-size: .85rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.posters { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.poster { display: flex; align-items: center; gap: .5rem; background: var(--soft); border-radius: .8rem; padding: .4rem .5rem; font-size: .85rem; font-weight: 700; line-height: 1.2; }
.poster svg { width: 2.8rem; height: 3.2rem; flex: none; }
.poster b { display: block; font-size: .95rem; font-weight: 900; }
.crit-mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3rem; }
.crit-mini li { display: flex; align-items: center; gap: .55rem; font-size: .8rem; line-height: 1.15; }
.crit-mini li b { display: block; font-size: .95rem; }
.crit-mini svg { width: 2.1rem; height: 2.1rem; flex: none; }
.side-actions { margin-top: auto; display: flex; gap: .6rem; }
.side-actions .btn { flex: 1; }
.recap { display: grid; gap: .55rem; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); min-height: 0; }
.recap-item {
  background: var(--panel); border: .12rem solid var(--panel-line); border-radius: .9rem; padding: .35rem .5rem;
  display: flex; flex-direction: column; gap: .25rem; min-height: 0; min-width: 0;
}
.recap-head { display: flex; align-items: center; gap: .4rem; font-weight: 900; font-size: .9rem; min-width: 0; }
.recap-head .avatar { width: 1.6rem; height: 1.6rem; }
.recap-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .2rem; container-type: size; }
.chip {
  flex: 1; min-height: 0; display: flex; align-items: center; gap: .4rem; background: var(--white); color: var(--navy);
  border-radius: .5rem; border-left: .35rem solid var(--tc); overflow: hidden;
}
.chip-art { height: 100%; aspect-ratio: 3 / 2; background: var(--tt); flex: none; padding: 2%; }
.chip-art svg { width: 100%; height: 100%; display: block; }
.chip-name { font-weight: 800; font-size: clamp(10px, 15cqh, 1.15rem); line-height: 1.05; padding-right: .3rem; overflow: hidden; }

/* ---------- Pitch order ---------- */
.order { display: grid; grid-template-columns: 1fr 1.3fr; gap: 2rem; align-items: center; padding: 1rem 2rem; }
.order-intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .8rem; }
.order-intro .scene { width: 20rem; height: 13rem; }
.order-intro h2 { font-size: 3rem; font-weight: 900; text-shadow: 0 .3rem 0 var(--navy); }
.order-intro p { font-size: 1.05rem; }
.order-intro .row { display: flex; gap: .8rem; }
.order-list { position: relative; height: calc(var(--n) * var(--row)); }
.order-item {
  position: absolute; left: 0; right: 0; top: calc(var(--pos) * var(--row)); height: calc(var(--row) - .4rem);
  display: flex; align-items: center; gap: .8rem; padding: 0 .8rem; background: var(--white); color: var(--navy);
  border-radius: .9rem; box-shadow: 0 .2rem .5rem rgba(6, 18, 70, .25); transition: top .25s ease;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.order-item.dragging { transition: none; z-index: 5; cursor: grabbing; box-shadow: 0 .8rem 1.6rem rgba(6, 18, 70, .45); }
.order-list.shuffling .order-item { transition: top .12s ease; }
.order-item .pos { width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--blue); color: var(--white); font-weight: 900; display: grid; place-items: center; flex: none; }
.order-list.shuffling .pos { visibility: hidden; }
.order-item .avatar { height: calc(var(--row) - 1.2rem); width: calc(var(--row) - 1.2rem); max-width: 3.2rem; max-height: 3.2rem; }
.order-item .oname { flex: 1; font-weight: 900; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order-item .grip { width: 1.4rem; opacity: .4; flex: none; }
.order-item .arrow { width: 2.2rem; height: 2.2rem; border-radius: .6rem; border: 0; background: var(--soft); color: var(--navy); cursor: pointer; display: grid; place-items: center; padding: 0; }
.order-item .arrow svg { width: 1.1rem; height: 1.1rem; }
.order-item .arrow[disabled] { opacity: .25; cursor: default; }

/* ---------- Pitch ---------- */
.pitch { display: grid; grid-template-columns: 1fr 1.05fr; gap: 1rem; }
.pitch-left { background: var(--panel); border-radius: 1.2rem; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .5rem; min-height: 0; }
.stage-row { display: flex; align-items: center; gap: 1rem; }
.stage-row .scene { width: 11rem; height: 7.3rem; flex: none; }
.now { font-size: .95rem; font-weight: 900; letter-spacing: .16em; color: var(--accent); }
.who { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.who .avatar { width: 4.2rem; height: 4.2rem; }
.pname { font-size: 2.1rem; font-weight: 900; line-height: 1.05; overflow-wrap: anywhere; }
.pteam { font-size: 1rem; opacity: .85; font-weight: 700; }
.sname { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1rem; }
.sname input { flex: 1; font-size: 1.1rem; }
.pitch-right {
  background: var(--panel-dark); border-radius: 1.2rem; padding: 1rem; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
}
.pitch-count { font-weight: 900; font-size: 1.2rem; background: rgba(255, 255, 255, .15); padding: .3rem 1rem; border-radius: 999px; }
.pitch-actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; margin-top: .4rem; }
.order-strip { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: center; margin-top: .4rem; }
.strip-item {
  position: relative; width: 3rem; height: 3rem; border-radius: 50%; border: .2rem solid transparent; padding: 0;
  background: none; cursor: pointer; opacity: .6;
}
.strip-item .avatar { width: 100%; height: 100%; }
.strip-item.current { border-color: var(--accent); opacity: 1; transform: scale(1.12); }
.strip-item.scored { opacity: 1; }
.strip-item .tick {
  position: absolute; right: -.35rem; bottom: -.35rem; width: 1.3rem; height: 1.3rem; border-radius: 50%;
  background: var(--green); color: var(--white); display: grid; place-items: center; font-size: .8rem; font-weight: 900;
}
.link-btn { background: none; border: 0; color: var(--white); text-decoration: underline; font-weight: 700; font-size: .85rem; cursor: pointer; opacity: .85; }

/* ---------- Score (one team) ---------- */
.score-team { display: flex; flex-direction: column; gap: .55rem; max-width: 74rem; margin: 0 auto; }
.score-head { display: flex; align-items: center; gap: 1rem; }
.score-head .scene { width: 8.5rem; height: 5.6rem; flex: none; }
.score-head .avatar { width: 4rem; height: 4rem; }
.score-head h2 { font-size: 2rem; font-weight: 900; line-height: 1.05; }
.score-head p { font-size: 1rem; opacity: .85; font-weight: 700; }
.crit-row {
  display: grid; grid-template-columns: 4rem minmax(0, 1fr) 21rem 3rem 9.5rem; align-items: center; gap: 1rem;
  background: var(--white); color: var(--navy); border-radius: 1rem; padding: .45rem 1rem;
}
.crit-icon svg { width: 4rem; height: 4rem; display: block; }
.crit-text b { display: block; font-size: 1.35rem; font-weight: 900; }
.crit-text span { font-size: .95rem; font-weight: 600; color: var(--muted); }
.big-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 1.3rem; border-radius: 1rem; margin: .8rem 0 .3rem;
  background: linear-gradient(to right, var(--blue) calc(var(--val) * 20%), var(--line) calc(var(--val) * 20%));
  outline: none; cursor: pointer; touch-action: none;
}
.big-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 2.7rem; height: 2.7rem; border-radius: 50%;
  background: var(--accent); border: .3rem solid var(--navy); box-shadow: 0 .2rem .4rem rgba(0, 0, 0, .3); cursor: grab;
}
.big-range::-moz-range-thumb {
  width: 2.7rem; height: 2.7rem; border-radius: 50%; box-sizing: border-box;
  background: var(--accent); border: .3rem solid var(--navy); box-shadow: 0 .2rem .4rem rgba(0, 0, 0, .3); cursor: grab;
}
.big-range::-moz-range-track { background: transparent; height: 1.3rem; }
.big-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 .3rem rgba(37, 86, 245, .4); }
.ticks { display: flex; justify-content: space-between; padding: .25rem 1.05rem 0; font-weight: 800; font-size: .8rem; color: var(--muted); }
.ticks span { width: .6rem; text-align: center; }
.crit-val { font-size: 2.8rem; font-weight: 900; text-align: center; color: var(--blue); }
.stars { display: flex; gap: .15rem; }
.stars svg { width: 1.75rem; height: 1.75rem; }
.star-shape { fill: var(--line); transition: fill .2s, transform .2s; transform-origin: center; transform-box: fill-box; }
.star-shape.on { fill: var(--accent); stroke: var(--navy); stroke-width: 1.5; }
.score-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .2rem; }
.total { font-size: 1.6rem; font-weight: 900; }
.total b { font-size: 3.4rem; color: var(--accent); margin: 0 .2rem; }

/* ---------- Score sheet ---------- */
.sheet { display: flex; flex-direction: column; }
.sheet-wrap { flex: 1; min-height: 0; overflow: auto; }
.sheet-table { width: 100%; border-collapse: separate; border-spacing: 0 .3rem; }
.sheet-table th { font-size: .9rem; font-weight: 900; padding: 0 .4rem .2rem; vertical-align: bottom; }
.sheet-table th svg { width: 2.4rem; height: 2.4rem; display: block; margin: 0 auto .15rem; background: var(--white); border-radius: 50%; padding: .25rem; }
.sheet-table td { background: var(--white); color: var(--navy); padding: .25rem .6rem; text-align: center; }
.sheet-table td:first-child { border-radius: .8rem 0 0 .8rem; text-align: left; }
.sheet-table td:last-child { border-radius: 0 .8rem .8rem 0; width: 15rem; }
.sheet-team { display: flex; align-items: center; gap: .6rem; }
.sheet-team .avatar { width: 2.4rem; height: 2.4rem; }
.sheet-team b { display: block; font-size: 1.05rem; }
.sheet-team small { font-size: .75rem; color: var(--muted); font-weight: 700; }
.score-sel {
  font-size: 1.25rem; font-weight: 900; padding: .15rem .4rem; border-radius: .6rem; border: 2px solid var(--line);
  background: var(--soft); color: var(--navy); cursor: pointer; min-width: 3.8rem;
}
.score-sel.empty { color: var(--muted); }
.status-cell { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; }
.tag-missing { background: var(--coral); color: var(--white); font-weight: 900; font-size: .75rem; padding: .2rem .55rem; border-radius: 999px; white-space: nowrap; }
.tag-ok { color: var(--green-dark); font-weight: 900; font-size: .85rem; }
.sheet .btn.small, .btn.small { font-size: .85rem; padding: .35rem .8rem; }
.hint { font-size: .85rem; opacity: .85; font-weight: 700; }

/* ---------- Results ---------- */
.results { display: grid; grid-template-columns: 1.45fr 1fr; gap: 1rem; }
.ranking { display: flex; flex-direction: column; gap: .35rem; min-height: 0; }
.ranking h2 { font-size: 1.7rem; font-weight: 900; margin-bottom: .2rem; }
.rank-row {
  flex: 1 1 0; min-height: 0; max-height: 4.8rem; display: grid; align-items: center; gap: .7rem;
  grid-template-columns: 3.6rem 2.8rem minmax(0, 1fr) 14rem 5.6rem;
  background: var(--white); color: var(--navy); border-radius: .9rem; padding: .2rem .8rem;
}
.rank-row.first { background: var(--accent); }
.rank-pos { font-size: 1.5rem; font-weight: 900; line-height: 1; text-align: center; }
.rank-pos small { display: block; font-size: .6rem; letter-spacing: .06em; }
.rank-row .avatar { width: 2.8rem; height: 2.8rem; }
.rank-name { min-width: 0; }
.rank-name b { display: block; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-name small { font-size: .75rem; font-weight: 700; color: var(--muted); }
.rank-row.first .rank-name small { color: var(--navy); }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: .15rem .5rem; }
.bar { display: flex; align-items: center; gap: .25rem; }
.bar svg { width: 1rem; height: 1rem; flex: none; }
.bar .track { flex: 1; height: .5rem; border-radius: 1rem; background: rgba(11, 30, 91, .12); overflow: hidden; }
.bar i { display: block; height: 100%; width: var(--w); background: var(--blue); border-radius: 1rem; transition: width .9s ease-out .2s; }
.rank-total { font-size: 1.9rem; font-weight: 900; text-align: right; white-space: nowrap; }
.rank-total small { font-size: .8rem; }
.results.animating .rank-row { opacity: 0; transform: translateX(-2rem) scale(.96); }
.results.animating .rank-row.show { opacity: 1; transform: none; transition: opacity .45s, transform .45s cubic-bezier(.3, 1.5, .5, 1); }
.results.animating .rank-row .bar i { width: 0; }
.results.animating .rank-row.show .bar i { width: var(--w); }
.results-side { display: flex; flex-direction: column; min-height: 0; gap: .6rem; }
.podium { flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; gap: .5rem; }
.pod-col { display: flex; flex-direction: column; align-items: center; width: 9rem; }
.pod-avatars { display: flex; flex-wrap: wrap; justify-content: center; gap: .2rem; margin-bottom: .3rem; transition: opacity .5s .6s; }
.pod-avatars .pa { display: flex; flex-direction: column; align-items: center; max-width: 8.5rem; }
.pod-avatars .avatar { width: 3.4rem; height: 3.4rem; }
.pod-col.many .pod-avatars .avatar { width: 2.4rem; height: 2.4rem; }
.pod-avatars small { font-size: .7rem; font-weight: 800; text-align: center; line-height: 1.1; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-step {
  width: 100%; border-radius: .8rem .8rem 0 0; display: flex; justify-content: center; padding-top: .4rem;
  font-size: 2.8rem; font-weight: 900; color: var(--navy); transform-origin: bottom;
  transition: transform .8s cubic-bezier(.3, 1.4, .5, 1);
}
.pod-1 .pod-step { height: 12rem; background: var(--accent); }
.pod-2 .pod-step { height: 8.5rem; background: var(--white); }
.pod-3 .pod-step { height: 6rem; background: var(--coral); color: var(--white); }
.results.animating .pod-step { transform: scaleY(0); }
.results.animating .pod-avatars { opacity: 0; }
.results.animating .podium.up .pod-step { transform: scaleY(1); }
.results.animating .podium.up .pod-avatars { opacity: 1; }
.results-actions { display: flex; flex-direction: column; align-items: center; gap: .4rem; min-height: 4.2rem; }
.results.animating .results-actions { visibility: hidden; }
.tie-banner { background: var(--accent); color: var(--navy); font-weight: 900; padding: .3rem 1rem; border-radius: 999px; font-size: 1.1rem; }

/* ---------- Final vote ---------- */
.vote { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; }
.vote h2 { font-size: 3rem; font-weight: 900; text-shadow: 0 .3rem 0 var(--navy); }
.rule { background: var(--accent); color: var(--navy); font-weight: 900; font-size: 1.25rem; padding: .6rem 1.4rem; border-radius: 1rem; }
.vote-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
.vote-card {
  width: 15rem; background: var(--white); color: var(--navy); border-radius: 1.2rem; padding: .9rem;
  display: flex; flex-direction: column; align-items: center; gap: .35rem; transition: transform .4s, box-shadow .4s;
}
.vote-card .avatar { width: 4.6rem; height: 4.6rem; }
.vc-name { font-size: 1.35rem; font-weight: 900; line-height: 1.1; }
.vc-team { font-size: .85rem; font-weight: 700; color: var(--muted); }
.vote-ctrl { display: flex; align-items: center; gap: .4rem; margin-top: .3rem; }
.vote-ctrl button {
  width: 3rem; height: 3rem; border-radius: 50%; border: 0; cursor: pointer; font-size: 1.8rem; font-weight: 900; line-height: 1;
  background: var(--blue); color: var(--white);
}
.vote-ctrl input { width: 4.4rem; text-align: center; font-size: 1.6rem; font-weight: 900; padding: .25rem; }
.vc-hidden { font-size: .75rem; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.vc-count { font-size: 3.6rem; font-weight: 900; color: var(--blue); line-height: 1; animation: popIn .5s cubic-bezier(.3, 1.6, .5, 1); }
.vc-count small { font-size: 1rem; }
.vote-card.win { box-shadow: 0 0 0 .4rem var(--accent), var(--shadow); transform: scale(1.06); }
.vote-card.lose { opacity: .65; }
.vote-actions { display: flex; gap: .8rem; align-items: center; }

/* ---------- Final ---------- */
.final { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .35rem; }
.final-kicker { font-size: 3.4rem; font-weight: 900; letter-spacing: .08em; color: var(--accent); text-shadow: 0 .3rem 0 var(--navy); }
.final .scene { width: 22rem; height: 14.5rem; }
.final-name { font-size: 4rem; font-weight: 900; line-height: 1.05; text-shadow: 0 .35rem 0 var(--navy); animation: popIn .8s cubic-bezier(.3, 1.6, .5, 1); }
.final-team { display: flex; align-items: center; gap: .6rem; font-size: 1.5rem; font-weight: 800; }
.final-team .avatar { width: 3.4rem; height: 3.4rem; }
.final-note { background: rgba(255, 255, 255, .16); border-radius: 999px; padding: .3rem 1.1rem; font-weight: 800; font-size: 1rem; }
.final-actions { display: flex; gap: .8rem; margin-top: .6rem; }

/* ---------- Modal ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(5, 12, 40, .72);
  display: flex; align-items: center; justify-content: center; animation: fadeIn .2s;
}
.modal {
  position: relative; background: var(--white); color: var(--navy); border-radius: 1.4rem; padding: 1.3rem 1.8rem;
  max-width: 92vw; max-height: 92vh; overflow: auto; box-shadow: var(--shadow); animation: popIn .3s cubic-bezier(.3, 1.4, .5, 1);
}
.modal.dark { background: var(--navy); color: var(--white); }
.modal h2 { font-size: 1.8rem; font-weight: 900; margin-bottom: .7rem; padding-right: 2.5rem; }
.modal .close { position: absolute; top: .8rem; right: .8rem; background: var(--soft); color: var(--navy); }
.modal.dark .close { background: rgba(255, 255, 255, .15); color: var(--white); }
.modal-actions { display: flex; gap: .8rem; justify-content: flex-end; margin-top: 1.2rem; }
.confirm-text { font-size: 1.3rem; font-weight: 700; max-width: 34rem; }
.zoom-head { display: flex; align-items: center; gap: .8rem; margin-bottom: .6rem; }
.zoom-head .avatar { width: 3.6rem; height: 3.6rem; }
.zoom-head h2 { margin: 0; }
.zoom-cards { width: 74rem; max-width: 86vw; height: 31rem; max-height: 68vh; display: flex; }
.zoom-foot { text-align: center; font-weight: 700; margin-top: .5rem; opacity: .85; }
.toolkit { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.toolkit li { background: var(--soft); border-left: .4rem solid var(--blue); border-radius: .7rem; padding: .6rem .9rem; font-size: 1.25rem; font-weight: 800; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: .6rem 1.2rem; align-items: center; font-size: 1.2rem; font-weight: 700; }
kbd { display: inline-block; min-width: 2.4rem; text-align: center; background: var(--soft); border: 2px solid var(--line); border-bottom-width: .25rem; border-radius: .5rem; padding: .15rem .6rem; font-family: var(--font); font-weight: 900; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Mascot & confetti ---------- */
.mascot {
  position: fixed; left: 1.2rem; bottom: .6rem; z-index: 60; display: flex; align-items: flex-end; gap: .3rem;
  pointer-events: none; transform: translateY(130%); transition: transform .5s cubic-bezier(.3, 1.5, .5, 1);
}
.mascot.show { transform: none; }
.mascot-art { width: 5.5rem; height: 7.7rem; animation: bob 1.6s ease-in-out infinite; }
.mascot-art svg, .mascot-big svg { width: 100%; height: 100%; display: block; }
.bubble {
  background: var(--white); color: var(--navy); font-weight: 900; font-size: 1.7rem; padding: .55rem 1.2rem;
  border-radius: 1.2rem 1.2rem 1.2rem .2rem; margin-bottom: 5.2rem; box-shadow: var(--shadow); white-space: nowrap;
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-.5rem) rotate(3deg); } }
#confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; width: 100vw; height: 100vh; }

/* ---------- Scene animations ---------- */
.float { animation: floatY 3s ease-in-out infinite; }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.flame { transform-box: fill-box; transform-origin: 50% 0; animation: flame .18s ease-in-out infinite alternate; }
@keyframes flame { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(1.25) scaleX(.9); } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
.spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite reverse; }
.spin-slow { transform-box: fill-box; transform-origin: center; animation: spin 20s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
.twinkle.d2 { animation-delay: .6s; } .twinkle.d3 { animation-delay: 1.2s; }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.6); } }
.beam { animation: beam 2.4s ease-in-out infinite alternate; }
@keyframes beam { from { opacity: .25; } to { opacity: .5; } }
.glow { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .4; } to { opacity: 1; } }

/* ---------- Small screens (1366x768 and below) ---------- */
@media (max-aspect-ratio: 4/3) {
  .setup { grid-template-columns: 1fr; overflow: auto; }
  .hero .scene { height: 10rem; }
}
</style>
</head>
<body data-step="setup">
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div class="mascot" id="mascot"><div class="mascot-art" id="mascot-art"></div><div class="bubble" id="mascot-bubble"></div></div>
<canvas id="confetti"></canvas>

<script>
'use strict';

/* =====================================================================
   EDITABLE DATA
   - CRITERIA: the 4 scoring criteria (name, question, icon)
   - CARDS: themes, targets and constraints (name + illustration)
   Illustrations are inline SVG (viewBox 0 0 150 100) using the palette
   classes defined in the CSS (fb = blue fill, kn = navy stroke, ...).
   ===================================================================== */

// Small drawing helpers used by the card illustrations
const star = (cx, cy, r, cls) => {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.45 : r;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return `<path class="${cls}" d="${d}Z"/>`;
};
const heart = (cx, cy, s, cls) =>
  `<path class="${cls}" transform="translate(${cx} ${cy}) scale(${s})" d="M0 9L-9 0A5 5 0 0 1 0 -6A5 5 0 0 1 9 0Z"/>`;
// A simple person: head centre near (0,6), shoulders down to y=52
const fig = (x, y, s, body, hair, extra = '') =>
  `<g transform="translate(${x} ${y}) scale(${s})"><path class="${body}" d="M-18 52Q-18 21 0 21Q18 21 18 52Z"/>` +
  `<circle class="fs" cx="0" cy="6" r="13"/><path class="${hair}" d="M-13.5 5A13.5 13.5 0 0 1 13.5 5Q7 -1 0 1Q-7 -1 -13.5 5Z"/>` +
  `<circle class="fn" cx="-4.5" cy="8" r="1.8"/><circle class="fn" cx="4.5" cy="8" r="1.8"/>${extra}</g>`;
const txt = (x, y, size, cls, s) =>
  `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="900" class="${cls}">${s}</text>`;

const CRITERIA = [
  {
    name: 'Creativity',
    question: 'How new and surprising is the idea?',
    icon: `<path class="ln kc" stroke-width="6" d="M50 5v9M17 17l7 7M83 17l-7 7M5 45h9M86 45h9"/>
      <circle class="fy" cx="50" cy="44" r="25"/><rect class="fe" x="38" y="64" width="24" height="15" rx="3"/>
      <rect class="fn" x="42" y="80" width="16" height="7" rx="3"/><path class="ln kn" stroke-width="3.5" d="M41 46l4.5 6 4.5-6 4.5 6 4.5-6"/>`
  },
  {
    name: 'Card Challenge',
    question: 'Does the startup really use its theme, target and constraint?',
    icon: `<g transform="rotate(-18 50 80)"><rect class="fl kn" stroke-width="3" x="30" y="20" width="36" height="52" rx="6"/></g>
      <rect class="fy kn" stroke-width="3" x="32" y="16" width="36" height="52" rx="6"/>
      <g transform="rotate(18 50 80)"><rect class="fc kn" stroke-width="3" x="34" y="20" width="36" height="52" rx="6"/></g>
      ${star(52, 44, 11, 'fw')}`
  },
  {
    name: 'Business Potential',
    question: 'Can it find customers and make money?',
    icon: `<rect class="fb" x="12" y="62" width="14" height="26" rx="2"/><rect class="fb" x="32" y="48" width="14" height="40" rx="2"/>
      <rect class="fb" x="52" y="34" width="14" height="54" rx="2"/>
      <path class="ln kc" stroke-width="6" d="M12 50l22-16 14 8 26-24"/><path class="fc" d="M80 10l2 18-16-6z"/>
      <circle class="fy kn" stroke-width="3" cx="78" cy="72" r="15"/>${txt(78, 79, 19, 'fn', '€')}`
  },
  {
    name: 'Pitch Power',
    question: 'Is the pitch clear, convincing and well presented in English?',
    icon: `<path class="ln kn" stroke-width="5" d="M30 46q0 22 20 22t20-22M50 68v16M36 88h28"/>

// Gear outline for the BUILD scene
function gearPath(cx, cy, ro, ri, teeth) {
  let d = '';
  const step = Math.PI * 2 / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const pts = [[ri, a], [ro, a + step * 0.15], [ro, a + step * 0.45], [ri, a + step * 0.6]];
    pts.forEach(([r, ang], k) => {
      d += (i === 0 && k === 0 ? 'M' : 'L') + (cx + r * Math.cos(ang)).toFixed(1) + ' ' + (cy + r * Math.sin(ang)).toFixed(1);
    });
  }
  return d + 'Z';
}
function wedge(cx, cy, r, a0, a1, cls) {
  const p = a => (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
  return `<path class="${cls}" d="M${cx} ${cy}L${p(a0)}A${r} ${r} 0 0 1 ${p(a1)}Z"/>`;
}

/* =====================================================================
   GAME STATE + SAVING
   ===================================================================== */
const STORE_KEY = 'startupRun.save.v1';
const STEPS = [
  { key: 'draw', label: 'DRAW' }, { key: 'build', label: 'BUILD' }, { key: 'pitch', label: 'PITCH' },
  { key: 'score', label: 'SCORE' }, { key: 'winner', label: 'WINNER' }
];
const STEP_INDEX = { setup: 0, draw: 1, build: 2, pitch: 3, score: 4, winner: 5 };

function makeTimer(min) {
  return { duration: min * 60000, remaining: min * 60000, endAt: null, running: false, done: false };
}
function defaultSetup() {
  return { numTeams: 4, names: Array.from({ length: 8 }, (_, i) => `Team ${i + 1}`), buildMin: 20, pitchMin: 3 };
}
function newState(sound = true, setup = defaultSetup()) {
  return {
    version: 1, step: 'setup', maxStep: 0, sound, setup,
    teams: [],
    build: { timer: makeTimer(setup.buildMin) },
    pitch: { order: [], ordered: false, current: 0, timer: makeTimer(setup.pitchMin) },
    scoreView: { team: null, from: null, draft: null },
    result: null,
    savedAt: Date.now()
  };
}

let state = newState();
const ui = { modal: null, resume: null, busy: false };

function save() {
  if (ui.resume) return; // never overwrite the saved game while the "Continue?" screen is shown
  state.savedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: game still works */ }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.version === 1 && s.setup ? s : null;
  } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
}
// A timer that was running when the page closed is paused at the time of the last save.
function restoreTimers(s) {
  [s.build.timer, s.pitch.timer].forEach(t => {
    if (t.running) {
      t.remaining = Math.max(0, t.endAt - (s.savedAt || Date.now()));
      t.running = false; t.endAt = null;
      if (t.remaining === 0) t.done = true;
    }
  });
  return s;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const range = n => Array.from({ length: n }, (_, i) => i);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const displayName = t => (t.startupName || '').trim() || t.name;

const sumScores = t => t.scores.reduce((a, v) => a + (v || 0), 0);
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
function fmtTime(ms) {
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* =====================================================================
   SOUND (Web Audio API, no files)
   ===================================================================== */
const Sound = {
  ctx: null, master: null, noiseBuf: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = state.sound ? 0.7 : 0;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  // Master volume: muting also silences sounds that are already playing (drumroll, applause)
  setEnabled(on) {
    if (!this.master) return;
    this.master.gain.cancelScheduledValues(0);
    this.master.gain.value = on ? 0.7 : 0;
  },
  ok() { return state.sound && this.ensure(); },
  tone(freq, start, dur, type = 'sine', vol = 0.25, freqEnd = null) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(this.master);
    o.start(start); o.stop(start + dur + 0.05);
  },
  noise(start, dur, vol, freq, type = 'bandpass', q = 1) {
    const c = this.ctx;
    if (!this.noiseBuf) {
      this.noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(start, Math.random() * 1.5); src.stop(start + dur + 0.05);
  },
  tick() { if (!this.ok()) return; this.tone(700 + Math.random() * 500, this.ctx.currentTime, 0.04, 'square', 0.05); },
  click() { if (!this.ok()) return; this.tone(500, this.ctx.currentTime, 0.05, 'triangle', 0.12); },
  reveal() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.07, 0.25, 'triangle', 0.2));
  },
  ready() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    [523, 659, 784].forEach((f, i) => this.tone(f, t + i * 0.1, 0.18, 'square', 0.08));
    this.tone(1047, t + 0.3, 0.5, 'square', 0.1);
    this.tone(1319, t + 0.3, 0.5, 'triangle', 0.12);
  },
  pop() { if (!this.ok()) return; this.tone(400, this.ctx.currentTime, 0.15, 'sine', 0.3, 1200); },
  alert() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(880, t, 0.15, 'square', 0.12); this.tone(880, t + 0.22, 0.15, 'square', 0.12);
  },
  timeUp() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    [784, 659, 523].forEach((f, i) => this.tone(f, t + i * 0.18, 0.2, 'square', 0.12));
    this.tone(392, t + 0.56, 0.8, 'square', 0.14);
  },
  buzzer() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(140, t, 1.0, 'sawtooth', 0.22); this.tone(147, t, 1.0, 'square', 0.12);
  },
  drumroll(sec = 2.5) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    for (let x = 0; x < sec; x += 0.045) this.noise(t + x, 0.06, 0.15 + 0.35 * (x / sec), 900, 'bandpass', 0.8);
    this.noise(t + sec, 1.2, 0.5, 5000, 'highpass');          // cymbal
    this.tone(90, t + sec, 0.4, 'sine', 0.5, 50);              // kick
  },
  applause(sec = 4) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < sec * 70; i++) {
      const x = Math.random() * sec;
      const fade = x > sec - 1 ? (sec - x) : 1;
      this.noise(t + x, 0.03 + Math.random() * 0.03, (0.1 + Math.random() * 0.2) * fade + 0.001, 1200 + Math.random() * 2500, 'bandpass', 1.5);
    }
  }
};

/* =====================================================================
   CONFETTI (hand-made canvas)
   ===================================================================== */
const Confetti = {
  canvas: null, ctx: null, parts: [], running: false, colors: [],
  init() {
    this.canvas = $('#confetti');
    this.ctx = this.canvas.getContext('2d');
    const cs = getComputedStyle(document.documentElement);
    this.colors = ['--accent', '--coral', '--white', '--sky', '--green', '--pink'].map(v => cs.getPropertyValue(v).trim());
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },
  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = innerWidth * dpr; this.canvas.height = innerHeight * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  add(x, y, vx, vy) {
    this.parts.push({
      x, y, vx, vy, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, color: this.colors[Math.floor(Math.random() * this.colors.length)], life: 0
    });
  },
  burst(x, y, n = 90) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
      this.add(x, y, Math.cos(a) * s, Math.sin(a) * s - 6);
    }
    this.start();
  },
  burstAt(el, n) {
    if (!el) return;
    const r = el.getBoundingClientRect();
    this.burst(r.left + r.width / 2, r.top + r.height / 2, n);
  },
  rain(n = 260) {
    for (let i = 0; i < n; i++) this.add(Math.random() * innerWidth, -Math.random() * innerHeight * 0.8, (Math.random() - 0.5) * 3, 2 + Math.random() * 3);
    this.start();
  },
  start() {
    if (this.running) return;
    this.running = true;
    requestAnimationFrame(() => this.frame());
  },
  frame() {
    const c = this.ctx;
    c.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.y < innerHeight + 30 && p.life < 600);
    for (const p of this.parts) {
      p.vy += 0.25; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.1)) + 1);
      c.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.frame());
    else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
};

const Mascot = {
  timer: null,
  say(text, ms = 2800) {
    $('#mascot-bubble').textContent = text;
    $('#mascot').classList.add('show');
    clearTimeout(this.timer);

/* =====================================================================
   TIMERS (always computed from the end time, so they stay right
   when the tab is in the background)
   ===================================================================== */
const getTimer = kind => state[kind].timer;
const timeLeft = t => t.running ? Math.max(0, t.endAt - Date.now()) : t.remaining;
const lastLeft = { build: null, pitch: null };

function timerStart(t) {
  if (t.running || t.done || t.remaining <= 0) return;
  t.endAt = Date.now() + t.remaining; t.running = true;
}
function timerPause(t) {
  if (!t.running) return;
  t.remaining = timeLeft(t); t.running = false; t.endAt = null;
}
function timerReset(t, durationMs = t.duration) {
  t.duration = durationMs; t.remaining = durationMs; t.running = false; t.endAt = null; t.done = false;
}
function thresholds(kind) {
  const t = getTimer(kind);
  if (kind === 'pitch') return [30000];
  return [300000, 60000].filter(th => t.duration > th);
}
function finishTimer(kind) {
  const t = getTimer(kind);
  t.running = false; t.remaining = 0; t.endAt = null; t.done = true;
  save();
  if (kind === 'build') Sound.timeUp(); else Sound.buzzer();
  Mascot.say("Time's up!", 3500);
  updateTimerDOM(kind);
}
function tick() {
  ['build', 'pitch'].forEach(kind => {
    const t = getTimer(kind);
    const left = timeLeft(t);
    const prev = lastLeft[kind];
    if (t.running) {
      if (prev !== null && thresholds(kind).some(th => prev > th && left <= th && left > 0)) Sound.alert();
      if (left <= 0) finishTimer(kind);
    }
    lastLeft[kind] = left;
    updateTimerDOM(kind);
  });
}
function timerHTML(kind, size) {
  return `<div class="timer" id="timer-${kind}" style="--tsize:${size}"><div class="digits">0:00</div></div>
    <div class="timer-controls">
      <button class="btn accent big main" data-action="timer-toggle" data-kind="${kind}" id="tbtn-${kind}"></button>
      <button class="btn ghost" data-action="timer-add" data-kind="${kind}" data-ms="-60000">−1 min</button>
      <button class="btn ghost" data-action="timer-add" data-kind="${kind}" data-ms="60000">+1 min</button>
      <button class="btn ghost" data-action="timer-reset" data-kind="${kind}">${ICONS.reset} Reset</button>
    </div>`;
}
function updateTimerDOM(kind) {
  const box = document.getElementById('timer-' + kind);
  if (!box) return;
  const t = getTimer(kind);
  const left = timeLeft(t);
  const digits = t.done ? "TIME'S UP!" : fmtTime(left);
  const d = box.firstElementChild;
  if (d.textContent !== digits) d.textContent = digits;
  const warnAt = kind === 'build' && t.duration > 300000 ? 300000 : -1;
  const dangerAt = kind === 'build' ? 60000 : 30000;
  box.classList.toggle('done', t.done);
  box.classList.toggle('danger', !t.done && left <= dangerAt);
  box.classList.toggle('warn', !t.done && left > dangerAt && left <= warnAt);
  const btn = document.getElementById('tbtn-' + kind);
  if (btn) {
    let label;
    if (t.running) label = ICONS.pause + ' Pause';
    else if (left >= t.duration) label = ICONS.play + ' Start';
    else label = ICONS.play + ' Resume';
    if (btn.innerHTML !== label) btn.innerHTML = label;
    btn.disabled = t.done || (!t.running && left <= 0);
  }
}
function toggleTimer(kind) {
  const t = getTimer(kind);
  if (t.running) timerPause(t);
  else { if (t.done) return; timerStart(t); if (t.running && timeLeft(t) >= t.duration - 500) Mascot.say('Ready? Go!', 1800); }
  Sound.click(); save(); lastLeft[kind] = timeLeft(t); updateTimerDOM(kind);
}

  if (ui.resume || ui.busy) return;

  if (needsShuffle()) setTimeout(() => { if (needsShuffle()) runShuffle(); }, 500);
  if (state.step === 'winner' && state.result && state.result.phase === 'ranking' && !state.result.animated) runRankingAnimation();
}

// Cards not held by any team in this category (draw without replacement)
function cardPool(type) {
  const held = new Set(state.teams.map(t => t.cards[type]).filter(v => v !== null));
  return range(CARDS[type].length).filter(i => !held.has(i));
}
async function drawCard(ti, type, { fast = false, reroll = false } = {}) {
  const t = state.teams[ti];
  const pool = cardPool(type);
  if (!pool.length) return;
  const wasReady = isReady(t);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const els = $$(`.card[data-team="${ti}"][data-type="${type}"]`);
  if (reroll) {
    els.forEach(el => { el.classList.remove('revealed'); const b = el.querySelector('.reroll'); if (b) b.remove(); });
    await wait(550);
  }
  // Slot machine: names scroll fast, then slow down
  els.forEach(el => el.classList.add('rolling'));
  const names = CARDS[type].map(c => c.name);
  let k = Math.floor(Math.random() * names.length), delay = fast ? 35 : 45, elapsed = 0;
  const total = fast ? 650 : 1500;
  while (elapsed < total) {
    k = (k + 1) % names.length;
    els.forEach(el => { el.querySelector('.slot').textContent = names[k]; });
    Sound.tick();
    await wait(delay);
    elapsed += delay;
    delay = Math.min(delay * 1.12, fast ? 110 : 230);
  }
  els.forEach(el => { el.querySelector('.slot').textContent = names[pick]; });
  await wait(fast ? 120 : 280);
  // Save, then flip the card
  t.cards[type] = pick;
  if (reroll) t.rerollUsed = true;
  save();
  els.forEach(el => {
    el.querySelector('.card-front').innerHTML = cardFront(type, pick);
    el.classList.remove('rolling');
    void el.offsetWidth;
    el.classList.add('revealed');
  });
  Sound.reveal();
  await wait(fast ? 500 : 800);
  render();
  if (!wasReady && isReady(t)) {
    Confetti.burstAt($(`[data-panel="${ti}"]`) || $('.zoom-cards'), 70);
    Sound.ready();
    if (allReady()) Mascot.say("Let's build!", 3000);
  }
}
async function runDraw(ti, type, opts) {
  ui.busy = true;
  try { await drawCard(ti, type, opts); } finally { ui.busy = false; }
}
async function drawAll() {
  ui.busy = true;
  try {
    for (let i = 0; i < state.teams.length; i++) {
      for (const c of CARD_TYPES) {
        if (state.teams[i].cards[c.key] === null) await drawCard(i, c.key, { fast: true });

}

async function runShuffle() {

// Drag and drop in the "Who goes first?" list (pointer events: mouse + touch)
let drag = null;
document.addEventListener('pointerdown', e => {
  const item = e.target.closest('.order-item');
  if (!item || e.target.closest('button') || ui.busy) return;
  ensureOrder();
  const list = $('#order-list');
  const ti = +item.dataset.drag;
  const order = state.pitch.order.slice();
  drag = { item, ti, order, startY: e.clientY, startIdx: order.indexOf(ti), target: order.indexOf(ti),
    rowPx: list.getBoundingClientRect().height / order.length };
  item.classList.add('dragging');
  if (item.setPointerCapture) item.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.startY;
  const n = drag.order.length;
  drag.item.style.top = (drag.startIdx * drag.rowPx + dy) + 'px';
  const target = Math.max(0, Math.min(n - 1, Math.round(drag.startIdx + dy / drag.rowPx)));
  if (target !== drag.target) {
    drag.target = target;
    const others = drag.order.filter(x => x !== drag.ti);
    others.splice(target, 0, drag.ti);
    $$('#order-list .order-item').forEach(it => { if (it !== drag.item) it.style.setProperty('--pos', others.indexOf(+it.dataset.drag)); });
    Sound.tick();
  }
});
function endDrag() {
  if (!drag) return;
  const order = drag.order.filter(x => x !== drag.ti);
  order.splice(drag.target, 0, drag.ti);
  state.pitch.order = order;
  drag = null;
  save();
  render();
}

// Competition ranking: equal totals share the same place (1, 2, 2, 4...)
function computeRanking() {
  const arr = state.teams.map((t, i) => ({ i, total: sumScores(t) }));
  arr.sort((a, b) => b.total - a.total || a.i - b.i);
  arr.forEach(r => {
    r.rank = 1 + arr.filter(o => o.total > r.total).length;
    r.shared = arr.filter(o => o.total === r.total).length > 1;
  });
  return arr;
}
function renderWinner() {
  const r = state.result;
  if (!r) return renderSheet();
  if (r.phase === 'vote') return renderVote();
  if (r.phase === 'final') return renderFinal();
  return renderRanking();
}
function renderRanking() {
  const r = state.result;
  const rk = computeRanking();
  const tie = rk.filter(x => x.rank === 1).length > 1;
  const rows = rk.map(x => {
    const t = state.teams[x.i];
    return `<div class="rank-row ${x.rank === 1 ? 'first' : ''}">
      <div class="rank-pos">${ordinal(x.rank)}${x.shared ? '<small>SHARED</small>' : ''}</div>${avatarHTML(t.avatar)}

      <div class="rank-total">${x.total}<small> /20</small></div>
    </div>`;
  }).join('');
  const podium = [2, 1, 3].map(rank => {
    const g = rk.filter(x => x.rank === rank);
    if (!g.length) return '';
    return `<div class="pod-col pod-${rank} ${g.length > 2 ? 'many' : ''}">
      <div class="pod-avatars">${g.map(x => `<div class="pa">${avatarHTML(state.teams[x.i].avatar)}<small>${esc(displayName(state.teams[x.i]))}</small></div>`).join('')}</div>
      <div class="pod-step">${rank}</div></div>`;
  }).join('');
  let actions;
  if (r.winner !== null) actions = `<button class="btn accent mega" data-action="back-final">STARTUP OF THE YEAR ${ICONS.arrow}</button>`;
  else if (tie) actions = `<div class="tie-banner">It's a tie for first place!</div><button class="btn accent mega pulse" data-action="final-vote">FINAL VOTE ${ICONS.arrow}</button>`;
  else actions = `<button class="btn accent mega pulse" data-action="show-final">AND THE WINNER IS… ${ICONS.arrow}</button>`;
  return `<section class="screen results ${r.animated ? '' : 'animating'}">
    <div class="ranking"><h2>The results</h2>${rows}</div>
    <div class="results-side"><div class="podium">${podium}</div><div class="results-actions">${actions}</div></div>
  </section>`;
}
async function runRankingAnimation() {
  if (ui.busy) return;
  ui.busy = true;
  Mascot.say('Drumroll, please!', 2600);

  await wait(2700);
