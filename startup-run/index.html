function voteWinners(v) {
  const max = Math.max(...v.candidates.map(i => v.votes[i] || 0));
  return v.candidates.filter(i => (v.votes[i] || 0) === max);
}
function renderVote() {
  const v = state.result.vote;
  const winners = v.revealed ? voteWinners(v) : [];
  const cards = v.candidates.map(i => {
    const t = state.teams[i], cnt = v.votes[i] || 0;
    const cls = !v.revealed ? '' : winners.length === 1 && winners[0] === i ? 'win' : winners.includes(i) ? '' : 'lose';
    const body = v.revealed
      ? `<div class="vc-count">${cnt}<small> ${cnt === 1 ? 'vote' : 'votes'}</small></div>`
      : `<div class="vote-ctrl">
          <button data-action="vote-step" data-team="${i}" data-d="-1" aria-label="Remove a vote">−</button>
          <input class="text-input" type="password" inputmode="numeric" autocomplete="off" maxlength="2" data-input="vote" data-team="${i}" value="${cnt}" aria-label="Votes">
          <button data-action="vote-step" data-team="${i}" data-d="1" aria-label="Add a vote">+</button>
        </div><div class="vc-hidden">VOTES ARE HIDDEN</div>`;
    return `<div class="vote-card ${cls}">${avatarHTML(t.avatar)}<div class="vc-name">${esc(displayName(t))}</div><div class="vc-team">${esc(t.name)}</div>${body}</div>`;
  }).join('');
  let actions;
  if (!v.revealed) actions = `<button class="btn accent mega" data-action="vote-reveal">REVEAL ${ICONS.arrow}</button>`;
  else if (winners.length === 1) actions = `<button class="btn accent mega pulse" data-action="show-final">STARTUP OF THE YEAR ${ICONS.arrow}</button>`;
  else actions = `<div class="tie-banner">Still a tie!</div><button class="btn accent mega pulse" data-action="vote-again">${ICONS.reroll} Vote again</button>`;
  return `<section class="screen vote">
    <h2>Final vote${v.round > 1 ? ` · round ${v.round}` : ''}</h2>
    <div class="rule">Raise your hand for the best startup. You cannot vote for your own team.</div>
    <div class="vote-grid">${cards}</div>
    <div class="vote-actions">${actions}</div>
  </section>`;
}
async function revealVote() {
  ui.busy = true;
  Mascot.say('And the winner is…', 2200);
  Sound.drumroll(1.8);
  await wait(2000);
  const r = state.result, v = r.vote;
  v.revealed = true;
  const winners = voteWinners(v);
  if (winners.length === 1) { r.winner = winners[0]; r.byVote = true; }
  save();
  ui.busy = false;
  render();
  if (winners.length === 1) { Sound.reveal(); Confetti.burstAt($('.vote-card.win'), 120); }
  else { Sound.alert(); Mascot.say("It's still a tie!", 3000); }
}
async function showFinal() {
  const r = state.result;
  if (r.winner === null) r.winner = computeRanking()[0].i;
  ui.busy = true;
  Mascot.say('And the winner is…', 2400);
  Sound.drumroll(2);
  await wait(2300);
  r.phase = 'final';
  save();
  ui.busy = false;
  render();
  celebrate();
}
function celebrate() {
  Confetti.rain(300);
  setTimeout(() => Confetti.rain(200), 1300);
  Sound.applause(5);
  Mascot.say('Congratulations!', 3500);
}
function renderFinal() {
  const r = state.result, t = state.teams[r.winner];
  return `<section class="screen final">
    <div class="final-kicker">STARTUP OF THE YEAR</div>
    ${sceneHTML('results')}
    <div class="final-name">${esc(displayName(t))}</div>
    <div class="final-team">${avatarHTML(t.avatar)}${esc(t.name)}</div>
    ${r.byVote ? '<div class="final-note">Winner after a final vote</div>' : ''}
    <div class="final-actions">
      <button class="btn ghost big" data-action="see-ranking">See the ranking</button>
      <button class="btn accent big" data-action="new-game">${ICONS.home} New game</button>
    </div>
  </section>`;
}

/* ---------- Modals ---------- */
function renderModal() {
  const root = $('#modal-root');
  const m = ui.modal;
  if (!m) { root.innerHTML = ''; root.dataset.key = ''; return; }
  const close = `<button class="iconbtn close" data-action="close-modal" title="Close (Esc)">${ICONS.close}</button>`;
  let html = '';
  if (m.type === 'zoom') {
    const t = state.teams[m.team], drawing = state.step === 'draw';
    html = `<div class="modal dark">${close}
      <div class="zoom-head">${avatarHTML(t.avatar)}<h2>${esc(displayName(t))}</h2>${isReady(t) ? '<span class="badge-ready">READY</span>' : ''}</div>
      <div class="zoom-cards"><div class="cards-row">${CARD_TYPES.map(c => cardHTML(m.team, c.key, drawing)).join('')}</div></div>
      <div class="zoom-foot">${drawing ? (t.rerollUsed ? 'No re-roll left' : '1 re-roll left') : ''}</div></div>`;
  } else if (m.type === 'toolkit') {
    html = `<div class="modal">${close}<h2>Pitch toolkit: useful phrases</h2>
      <ul class="toolkit">${TOOLKIT.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
  } else if (m.type === 'help') {
    html = `<div class="modal">${close}<h2>Keyboard shortcuts</h2><div class="keys">
      <kbd>Space</kbd><span>Start / pause the timer</span><kbd>F</kbd><span>Full screen</span>
      <kbd>M</kbd><span>Sound on / off</span><kbd>?</kbd><span>Show this help</span><kbd>Esc</kbd><span>Close a window</span></div>
      <p style="margin-top:1rem;font-weight:700;color:var(--muted)">The game is saved automatically. You can close the browser and continue later.</p></div>`;
  } else if (m.type === 'confirm') {
    html = `<div class="modal"><h2>${esc(m.title)}</h2><p class="confirm-text">${esc(m.text)}</p>
      <div class="modal-actions"><button class="btn" style="background:var(--soft)" data-action="close-modal">Cancel</button>
      <button class="btn accent big" data-action="confirm-yes">${esc(m.yes)}</button></div></div>`;
  }
  const key = m.type + (m.team ?? '');
  root.innerHTML = `<div class="modal-bg" data-action="modal-bg"${root.dataset.key === key ? ' style="animation:none"' : ''}>${html}</div>`;
  if (root.dataset.key === key) root.querySelector('.modal').style.animation = 'none';
  root.dataset.key = key;
}
function openModal(m) { ui.modal = m; renderModal(); }
function closeModal() { ui.modal = null; renderModal(); }
function confirmBox(title, text, yes, onYes) { openModal({ type: 'confirm', title, text, yes, onYes }); }

/* =====================================================================
   ACTIONS
   ===================================================================== */
function startGame() {
  const s = state.setup;
  state.teams = range(s.numTeams).map(i => ({
    name: (s.names[i] || '').trim() || `Team ${i + 1}`, avatar: i,
    cards: { theme: null, target: null, constraint: null }, rerollUsed: false,
    startupName: '', scores: [null, null, null, null]
  }));
  state.build = { timer: makeTimer(s.buildMin) };
  state.pitch = { order: [], ordered: false, current: 0, timer: makeTimer(s.pitchMin) };
  state.scoreView = { team: null, from: null, draft: null };
  state.result = null;
  state.step = 'draw';
  state.maxStep = 1;
  save();
  render();
  Sound.reveal();
  Mascot.say('Ready?', 2500);
}
function gotoStep(key) {
  const idx = STEP_INDEX[key];
  if (idx > state.maxStep) return;
  const go = () => {
    if (key === 'winner' && !state.result) { startResults(); return; }
    state.step = key;
    if (key === 'score') state.scoreView = { team: null, from: null, draft: null };
    save();
    render();
  };
  if (state.step === 'winner' && key !== 'winner' && state.result) {
    confirmBox('Go back?', 'The results and the final vote will be reset.', 'Yes, go back', () => {
      state.result = null;
      state.maxStep = 4;
      go();
    });
  } else go();
}
function startResults() {
  if (!allScored()) return;
  state.result = { phase: 'ranking', animated: false, vote: null, winner: null, byVote: false };
  state.step = 'winner';
  state.maxStep = 5;
  save();
  render();
}
function toggleSound() {
  state.sound = !state.sound;
  Sound.ensure();
  Sound.setEnabled(state.sound);
  save();
  renderHeader();
  if (state.sound) Sound.click();
}
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    const fs = d.fullscreenElement || d.webkitFullscreenElement;
    const p = !fs ? (el.requestFullscreen || el.webkitRequestFullscreen).call(el) : (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* fullscreen not available */ }
}
function currentTimerKind() {
  if (state.step === 'build') return 'build';
  if (state.step === 'pitch' && state.pitch.ordered) return 'pitch';
  return null;
}
function newGame() {
  confirmBox('New game?', 'The current game will be deleted.', 'Yes, new game', () => {
    clearSave();
    state = newState(state.sound, state.setup);
    lastLeft.build = lastLeft.pitch = null;
    save();
    render();
  });
}

const ACTIONS = {
  'set-teams': el => { state.setup.numTeams = +el.dataset.n; save(); render(); },
  'set-build': el => { state.setup.buildMin = +el.dataset.min; save(); render(); },
  'set-pitch': el => { state.setup.pitchMin = +el.dataset.min; save(); render(); },
  start: startGame,
  'resume-continue': () => {
    state = restoreTimers(ui.resume);
    ui.resume = null;
    lastLeft.build = lastLeft.pitch = null;
    save();
    render();
    Sound.reveal();
  },
  'resume-new': () => {
    const setup = ui.resume.setup || defaultSetup();
    ui.resume = null;
    clearSave();
    state = newState(state.sound, setup);
    save();
    render();
  },
  draw: el => {
    const ti = +el.dataset.team, type = el.dataset.type;
    if (state.teams[ti].cards[type] === null) {
      if (state.step === 'draw') runDraw(ti, type);
    } else if (!ui.modal) openModal({ type: 'zoom', team: ti });
  },
  reroll: (el, e) => {
    e.stopPropagation();
    const t = state.teams[+el.dataset.team];
    if (!t.rerollUsed && state.step === 'draw') runDraw(+el.dataset.team, el.dataset.type, { reroll: true });
  },
  'draw-all': drawAll,
  zoom: el => openModal({ type: 'zoom', team: +el.dataset.team }),
  'close-modal': closeModal,
  'modal-bg': (el, e) => { if (e.target === el) closeModal(); },
  'confirm-yes': () => { const fn = ui.modal && ui.modal.onYes; closeModal(); if (fn) fn(); },
  'lets-build': () => {
    state.step = 'build';
    state.maxStep = Math.max(state.maxStep, 2);
    save(); render();
    Mascot.say("Let's build!", 2500);
  },
  'timer-toggle': el => toggleTimer(el.dataset.kind),
  'timer-add': el => {
    const kind = el.dataset.kind, t = getTimer(kind);
    const left = Math.max(0, timeLeft(t) + (+el.dataset.ms));
    if (t.running) t.endAt = Date.now() + left; else t.remaining = left;
    if (left > 0) t.done = false;
    lastLeft[kind] = left;
    Sound.click();
    save();
    if (left === 0 && !t.done) finishTimer(kind); else updateTimerDOM(kind);
  },
  'timer-reset': el => {
    const kind = el.dataset.kind, t = getTimer(kind);
    timerReset(t);
    lastLeft[kind] = null;
    Sound.click(); save(); updateTimerDOM(kind);
  },
  toolkit: () => openModal({ type: 'toolkit' }),
  'go-pitches': () => {
    const t = state.build.timer;
    const go = () => { timerPause(t); state.step = 'pitch'; state.maxStep = Math.max(state.maxStep, 3); save(); render(); };
    if (!t.done) confirmBox('Go to the pitches?', 'The build time is not over yet.', 'Yes, go!', go); else go();
  },
  shuffle: runShuffle,
  'order-move': el => {
    ensureOrder();
    const o = state.pitch.order, ti = +el.dataset.team;
    const a = o.indexOf(ti), b = a + (+el.dataset.dir);
    if (b < 0 || b >= o.length) return;
    [o[a], o[b]] = [o[b], o[a]];
    Sound.click(); save(); render();
  },
  'start-pitches': () => {
    state.pitch.ordered = true;
    setPitch(0);
    Mascot.say('Ready?', 2200);
  },
  'change-order': () => { timerPause(state.pitch.timer); state.pitch.ordered = false; save(); render(); },
  'pitch-prev': () => setPitch(state.pitch.current - 1),
  'pitch-jump': el => setPitch(+el.dataset.pos),
  'pitch-next': () => {
    const p = state.pitch;
    if (p.current < state.teams.length - 1) { setPitch(p.current + 1); return; }
    timerPause(p.timer);
    state.step = 'score';
    state.scoreView = { team: null, from: null, draft: null };
    state.maxStep = Math.max(state.maxStep, 4);
    save(); render();
  },
  'back-pitch': () => { state.step = 'pitch'; save(); render(); },
  'score-this': () => openScoring(state.pitch.order[state.pitch.current], 'pitch'),
  'score-open': el => openScoring(+el.dataset.team, 'sheet'),
  'score-save': () => {
    const sv = state.scoreView;
    state.teams[sv.team].scores = sv.draft.slice();
    state.scoreView = { team: null, from: null, draft: null };
    Sound.ready();
    Mascot.say('Great pitch!', 2200);
    if (sv.from === 'pitch' && state.pitch.current < state.teams.length - 1) { setPitch(state.pitch.current + 1); return; }
    state.step = 'score';
    save(); render();
  },
  'score-cancel': () => {
    const from = state.scoreView.from;
    state.scoreView = { team: null, from: null, draft: null };
    state.step = from === 'pitch' ? 'pitch' : 'score';
    save(); render();
  },
  reveal: startResults,
  'final-vote': () => {
    const r = state.result;
    if (!r.vote) r.vote = { round: 1, candidates: computeRanking().filter(x => x.rank === 1).map(x => x.i), votes: {}, revealed: false };
    r.phase = 'vote';
    save(); render();
  },
  'vote-step': el => {
    const v = state.result.vote, i = +el.dataset.team;
    v.votes[i] = Math.max(0, Math.min(99, (v.votes[i] || 0) + (+el.dataset.d)));
    const input = document.querySelector(`input[data-input="vote"][data-team="${i}"]`);
    if (input) input.value = v.votes[i];
    Sound.click(); save();
  },
  'vote-reveal': revealVote,
  'vote-again': () => {
    const v = state.result.vote;
    state.result.vote = { round: v.round + 1, candidates: voteWinners(v), votes: {}, revealed: false };
    save(); render();
  },
  'show-final': showFinal,
  'back-final': () => { state.result.phase = 'final'; save(); render(); },
  'see-ranking': () => { state.result.phase = 'ranking'; save(); render(); },
  goto: el => gotoStep(el.dataset.step),
  sound: toggleSound,
  fullscreen: toggleFullscreen,
  help: () => openModal({ type: 'help' }),
  'new-game': newGame
};

const INPUTS = {
  'team-name': el => { state.setup.names[+el.dataset.i] = el.value; save(); },
  'build-custom': el => {
    const v = parseInt(el.value, 10);
    if (!(v >= 1 && v <= 120)) return;
    state.setup.buildMin = v;
    save();
    $$('[data-action="set-build"]').forEach(b => b.classList.toggle('on', +b.dataset.min === v));
    el.parentElement.classList.toggle('on', !BUILD_TIMES.includes(v));
  },
  'startup-name': el => {
    const t = state.teams[+el.dataset.team];
    t.startupName = el.value;
    save();
    const p = $('#pname');
    if (p) p.textContent = displayName(t);
  },
  score: el => {
    const c = +el.dataset.c, v = +el.value, d = state.scoreView.draft;
    if (d[c] === v) return;
    d[c] = v;
    el.style.setProperty('--val', v);
    $('#cv-' + c).textContent = v;
    $('#st-' + c).innerHTML = range(5).map(k => STAR_SVG(k < v)).join('');
    $('#score-total').textContent = d.reduce((a, b) => a + b, 0);
    Sound.tick();
    save();
  },
  vote: el => {
    el.value = el.value.replace(/\D/g, '');
    state.result.vote.votes[+el.dataset.team] = Math.min(99, parseInt(el.value, 10) || 0);
    save();
  }
};
const CHANGES = {
  'sheet-score': el => {
    if (el.value === '') return;
    state.teams[+el.dataset.team].scores[+el.dataset.c] = +el.value;
    save(); render();
  },
  'build-custom': () => render()
};

/* =====================================================================
   EVENTS + START
   ===================================================================== */
const ALWAYS_OK = new Set(['sound', 'fullscreen', 'help', 'close-modal', 'modal-bg']);
document.addEventListener('click', e => {
  Sound.ensure();
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const name = el.dataset.action;
  if (ui.busy && !ALWAYS_OK.has(name)) return;
  if (ACTIONS[name]) ACTIONS[name](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el);
});
document.addEventListener('change', e => {
  const el = e.target;
  const key = el.dataset && (el.dataset.change || el.dataset.input);
  if (key && CHANGES[key]) CHANGES[key](el);
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  const typing = tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && e.target.type !== 'range');
  if (e.key === 'Escape') { if (ui.modal) { closeModal(); e.preventDefault(); } return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  Sound.ensure();
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    const kind = currentTimerKind();
    if (kind && !ui.modal && !ui.resume) toggleTimer(kind);
  } else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === '?') openModal({ type: 'help' });
});

function init() {
  $('#mascot-art').innerHTML = MASCOT_SVG;
  Confetti.init();
  const saved = loadSaved();
  if (saved) {
    state.sound = saved.sound !== false;
    if (saved.step !== 'setup' && saved.teams && saved.teams.length) ui.resume = saved;
    else state = saved;
  }
  render();
  setInterval(tick, 200);
  // While a timer runs, save regularly so a closed page resumes at the right time
  setInterval(() => { if (state.build.timer.running || state.pitch.timer.running) save(); }, 5000);
  window.addEventListener('pagehide', () => save());
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
init();
</script>
</body>
</html>
